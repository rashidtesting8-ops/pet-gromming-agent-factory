[project]
name = "pet-grooming-engine"
version = "0.2.0"
description = "Pet Grooming Website Builder Engine (EditVista) — Local Collector v2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "Pillow>=10,<13",
    "requests>=2.31,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.55,<2",
]
social = [
    "gallery-dl>=1.30,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.396,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-beautifulsoup4>=4.12,<5",
    "types-requests>=2.31,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "app"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "app", "tests"]
extraPaths = ["src", "."]
typeCheckingMode = "standard"
